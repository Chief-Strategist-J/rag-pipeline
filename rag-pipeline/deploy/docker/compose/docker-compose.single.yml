version: "3.9"

services:
  rag-pipeline:
    build:
      context: ../../
      dockerfile: deploy/docker/service/Dockerfile
    image: rag-pipeline:latest
    container_name: rag-pipeline-service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - ../../.env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
    networks:
      - rag-network

networks:
  rag-network:
    name: rag-single-network
    driver: bridge
