apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-staging

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rag-pipeline
      spec:
        replicas: 2
        template:
          spec:
            containers:
              - name: rag-pipeline-service
                resources:
                  requests:
                    cpu: "500m"
                    memory: "1Gi"
                  limits:
                    cpu: "2"
                    memory: "4Gi"
