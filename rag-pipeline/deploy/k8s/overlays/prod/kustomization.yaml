apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-prod

bases:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rag-pipeline
      spec:
        replicas: 3
        template:
          spec:
            containers:
              - name: rag-pipeline-service
                resources:
                  requests:
                    cpu: "1"
                    memory: "2Gi"
                  limits:
                    cpu: "4"
                    memory: "8Gi"
