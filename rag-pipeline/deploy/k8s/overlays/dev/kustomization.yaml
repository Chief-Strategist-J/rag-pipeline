apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-dev

bases:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rag-pipeline
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: rag-pipeline-service
                resources:
                  requests:
                    cpu: "250m"
                    memory: "512Mi"
                  limits:
                    cpu: "1"
                    memory: "2Gi"
