apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: rag-pipeline-scaler
  labels:
    app.kubernetes.io/name: rag-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-pipeline
  minReplicaCount: 2
  maxReplicaCount: 20
  cooldownPeriod: 300
  pollingInterval: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
        metricName: http_requests_per_second
        query: sum(rate(http_requests_total{job="rag-pipeline"}[2m]))
        threshold: "100"
    - type: kafka
      metadata:
        bootstrapServers: kafka:9092
        consumerGroup: rag-pipeline-workers
        topic: rag.cdc.change-feed.v1
        lagThreshold: "50"
        offsetResetPolicy: earliest
