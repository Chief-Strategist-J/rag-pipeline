apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-db
  labels:
    app.kubernetes.io/name: langfuse-db
    app.kubernetes.io/part-of: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "langfuse"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-db
  labels:
    app.kubernetes.io/name: langfuse-db
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    app.kubernetes.io/name: langfuse-db
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  labels:
    app.kubernetes.io/name: langfuse-web
    app.kubernetes.io/part-of: rag-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-web
    spec:
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:2
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:password@langfuse-db:5432/langfuse"
            - name: NEXTAUTH_URL
              value: "http://localhost:3000"
            - name: NEXTAUTH_SECRET
              value: "secret_key_for_langfuse_auth_min_32_characters"
            - name: SALT
              value: "secret_salt_for_langfuse_min_32_characters"
            - name: TELEMETRY_ENABLED
              value: "false"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  labels:
    app.kubernetes.io/name: langfuse-web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: 3000
  selector:
    app.kubernetes.io/name: langfuse-web
