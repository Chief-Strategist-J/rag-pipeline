[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production Open-Source RAG Pipeline featuring Debezium, Docling, Haystack, BGE-M3/Qwen3, TEI, Qdrant, vLLM, Valkey, NeMo Guardrails, Ragas, and Langfuse"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Jaydeep Vagh", email = "jaydeep.9664920749@gmail.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "haystack-ai>=2.5.0",
    "qdrant-client>=1.11.0",
    "langfuse>=2.50.0",
    "aiokafka>=0.11.0",
    "valkey>=5.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
