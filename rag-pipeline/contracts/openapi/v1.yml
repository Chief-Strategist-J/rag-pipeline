openapi: 3.1.0
info:
  title: RAG Pipeline Delivery API
  version: 1.0.0
  description: Production-grade RAG pipeline API contract adhering to RFC 9457 and strict response envelopes.

servers:
  - url: /api/v1
    description: V1 Production Prefix

paths:
  /authz-rewrite/process:
    post:
      summary: Resolve authorization scope and rewrite conversational query
      operationId: processAuthzRewrite
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RewriteInputPayload'
      responses:
        '200':
          description: Query successfully processed and contextualized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthzRewriteResponseEnvelope'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '500':
          description: Internal processing exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /pipeline/ingest:
    post:
      summary: Ingest and index new document content into the pipeline
      operationId: ingestPipelineDocument
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentIngestPayload'
      responses:
        '200':
          description: Document chunks parsed, enriched and registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentIngestResponseEnvelope'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

  /pipeline/query:
    post:
      summary: Execute end-to-end multi-stage RAG query pipeline
      operationId: queryPipeline
      parameters:
        - name: traceparent
          in: header
          required: false
          schema:
            type: string
        - name: x-request-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipelineQueryPayload'
      responses:
        '200':
          description: Query successfully orchestrated through all stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipelineQueryResponseEnvelope'
        '400':
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'
        '500':
          description: Internal processing exception
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseEnvelope'

components:
  schemas:
    ConversationTurn:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
      additionalProperties: false

    RewriteInputPayload:
      type: object
      required:
        - query
        - tenantId
        - userId
      properties:
        query:
          type: string
          minLength: 1
        tenantId:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        conversationHistory:
          type: array
          items:
            $ref: '#/components/schemas/ConversationTurn'
          default: []
        skipRewriteIfFirstTurn:
          type: boolean
          default: true
      additionalProperties: false

    PermissionScope:
      type: object
      required:
        - tenantId
        - userId
        - allowedAcls
        - allowedPartitions
      properties:
        tenantId:
          type: string
        userId:
          type: string
        allowedAcls:
          type: array
          items:
            type: string
        allowedPartitions:
          type: array
          items:
            type: string
      additionalProperties: false

    RewrittenQueryData:
      type: object
      required:
        - originalQuery
        - rewrittenQuery
        - wasRewritten
        - permissionScope
        - resolvedTenantId
      properties:
        originalQuery:
          type: string
        rewrittenQuery:
          type: string
        wasRewritten:
          type: boolean
        permissionScope:
          $ref: '#/components/schemas/PermissionScope'
        resolvedTenantId:
          type: string
      additionalProperties: false

    ResponseMeta:
      type: object
      required:
        - requestId
        - timestamp
        - executionTimeMs
        - apiVersion
      properties:
        requestId:
          type: string
        correlationId:
          type: string
          nullable: true
        causationId:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
        executionTimeMs:
          type: integer
        apiVersion:
          type: string
      additionalProperties: false

    ErrorDetail:
      type: object
      required:
        - field
        - issue
        - rule
      properties:
        field:
          type: string
        issue:
          type: string
        rule:
          type: string
        rejectedValue:
          nullable: true
      additionalProperties: false

    ResponseError:
      type: object
      required:
        - code
        - message
        - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
          default: []
      additionalProperties: false

    AuthzRewriteResponseEnvelope:
      type: object
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/RewrittenQueryData'
        error:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false

    ErrorResponseEnvelope:
      type: object
      required:
        - success
        - statusCode
        - data
        - error
        - meta
      properties:
        success:
          type: boolean
          example: false
        statusCode:
          type: integer
          example: 400
        data:
          nullable: true
        error:
          $ref: '#/components/schemas/ResponseError'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false

    PipelineQueryPayload:
      type: object
      required:
        - query
        - tenantId
        - userId
      properties:
        query:
          type: string
          minLength: 1
        tenantId:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        conversationHistory:
          type: array
          items:
            $ref: '#/components/schemas/ConversationTurn'
          default: []
      additionalProperties: false

    PipelineQueryResultData:
      type: object
      required:
        - requestId
        - tenantId
        - query
        - rewrittenQuery
        - answer
        - citedChunkIds
        - abstained
        - isGrounded
        - totalDurationMs
      properties:
        requestId:
          type: string
        tenantId:
          type: string
        query:
          type: string
        rewrittenQuery:
          type: string
        answer:
          type: string
        citedChunkIds:
          type: array
          items:
            type: string
        abstained:
          type: boolean
        isGrounded:
          type: boolean
        totalDurationMs:
          type: number
      additionalProperties: false

    PipelineQueryResponseEnvelope:
      type: object
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/PipelineQueryResultData'
        error:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false

    DocumentIngestPayload:
      type: object
      required:
        - documentId
        - content
      properties:
        tenantId:
          type: string
          default: tenant-corp
        documentId:
          type: string
          minLength: 1
        version:
          type: integer
          default: 1
        sectionTitle:
          type: string
          default: General
        content:
          type: string
          minLength: 1
        aclTags:
          type: array
          items:
            type: string
          default: [INTERNAL, PUBLIC]
      additionalProperties: false

    DocumentIngestResultData:
      type: object
      required:
        - documentId
        - totalChunksAdded
        - chunkIds
      properties:
        documentId:
          type: string
        totalChunksAdded:
          type: integer
        chunkIds:
          type: array
          items:
            type: string
      additionalProperties: false

    DocumentIngestResponseEnvelope:
      type: object
      required:
        - success
        - statusCode
        - data
        - meta
      properties:
        success:
          type: boolean
          example: true
        statusCode:
          type: integer
          example: 200
        data:
          $ref: '#/components/schemas/DocumentIngestResultData'
        error:
          nullable: true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
      additionalProperties: false

